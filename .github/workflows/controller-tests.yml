name: controller-tests

on:
  push:
    branches: [main, phase1-core]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controller
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install controller
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Offline orchestration simulation
        run: xmb-sim
      - name: Compile all Python modules
        run: python -m compileall -q src tests
      - name: Install LuaJIT for addon syntax validation
        run: sudo apt-get update -qq && sudo apt-get install -y -qq luajit
        working-directory: .
      - name: Compile Ashita addon syntax
        run: luajit -b ashita/addons/xicommand/xicommand.lua /tmp/xicommand.luac
        working-directory: .
