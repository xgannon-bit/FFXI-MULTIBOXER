[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ffxi-multiboxer"
version = "0.1.0"
description = "Attended FFXI multibox orchestration controller"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
xmb-controller = "ffxi_multiboxer.server:main"

[tool.setuptools.packages.find]
where = ["src"]
